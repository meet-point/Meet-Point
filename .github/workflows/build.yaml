name: Java CI/CD

on:
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  publish-starter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          gradle-wrapper-directory: ./meetpoint-security-starter
          cache-read-only: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Publish starter to local Maven
        run: ./gradlew publishToMavenLocal
        working-directory: ./meetpoint-security-starter

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Set up JDK17 + Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          java-version: 17
          distribution: temurin
          gradle-wrapper-directory: backend
          cache-read-only: false

      - name: Build with Gradle
        working-directory: backend
        run: ./gradlew clean build

      - name: Jacoco pull request commit
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: |
            ${{ github.workspace }}/backend/**/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 30
          min-coverage-changed-files: 30
          title: Code Coverage
          update-comment: true