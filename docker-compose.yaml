services:

  consul:
    image: hashicorp/consul:1.16
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: "agent -server -bootstrap -ui -client=0.0.0.0"
    networks:
      - backend

  api-gateway:
    build:
      context: backend/gateway-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_CONSUL_HOST=consul
    depends_on:
      - consul
    networks:
      - backend

  auth-service:
    build:
      context: backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    expose:
      - 8080
    depends_on:
      - auth-db
      - auth-liquibase
      - auth-redis
      - consul
    env_file:
      - .env
    environment:
      AUTH_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      AUTH_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    restart: no
    networks:
      - backend
      - auth-network

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_SERVICE_DATASOURCE_DB}
      POSTGRES_USER: ${AUTH_SERVICE_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_SERVICE_DATASOURCE_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - auth-network

  auth-liquibase:
    image: liquibase/liquibase:4.29
    container_name: auth-liquibase
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ./backend/auth-service/migrations/changelog:/changesets
    command:
      - --searchPath=${AUTH_SERVICE_LIQUIBASE_SEARCH_PATH}
      - --changelog-file=${AUTH_SERVICE_LIQUIBASE_CHANGELOG_FILE}
      - --driver=${AUTH_SERVICE_LIQUIBASE_DRIVER}
      - --url=${AUTH_SERVICE_LIQUIBASE_URL}
      - --username=${AUTH_SERVICE_LIQUIBASE_USERNAME}
      - --password=${AUTH_SERVICE_LIQUIBASE_PASSWORD}
      - update
    networks:
      - auth-network

  auth-redis:
    image: redis:7.2
    container_name: auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - auth-network

  event-service:
    build:
      context: backend/event-service
      dockerfile: Dockerfile
    container_name: event-service
    depends_on:
      - event-db
      - event-liquibase
      - consul
    expose:
      - 8080
    env_file:
      - .env
    restart: no
    networks:
      - event-network
      - backend

  event-db:
    image: postgres:16-alpine
    container_name: event-db
    environment:
      POSTGRES_DB: ${EVENT_SERVICE_DATASOURCE_DB}
      POSTGRES_USER: ${EVENT_SERVICE_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${EVENT_SERVICE_DATASOURCE_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - event-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - event-network

  event-liquibase:
    image: liquibase/liquibase:4.29
    container_name: event-liquibase
    depends_on:
      event-db:
        condition: service_healthy
    volumes:
      - ./backend/event-service/migrations/changelog:/changesets
    command:
      - --searchPath=${EVENT_SERVICE_LIQUIBASE_SEARCH_PATH}
      - --changelog-file=${EVENT_SERVICE_LIQUIBASE_CHANGELOG_FILE}
      - --driver=${EVENT_SERVICE_LIQUIBASE_DRIVER}
      - --url=${EVENT_SERVICE_LIQUIBASE_URL}
      - --username=${EVENT_SERVICE_LIQUIBASE_USERNAME}
      - --password=${EVENT_SERVICE_LIQUIBASE_PASSWORD}
      - update
    networks:
      - event-network

  user-service:
    build:
      context: backend/user-service
      dockerfile: Dockerfile
    container_name: user-service
    depends_on:
      - consul
      - user-db
    expose:
      - 8080
    env_file:
      - .env
    restart: no
    networks:
      - user-network
      - backend

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: ${USER_SERVICE_DATASOURCE_DB}
      POSTGRES_USER: ${USER_SERVICE_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${USER_SERVICE_DATASOURCE_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - user-network

volumes:
  auth-db-data:
  event-db-data:
  redis-data:
  user-db-data:

networks:
  auth-network:
  event-network:
  user-network:
  backend:

